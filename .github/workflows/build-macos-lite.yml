name: Build Quran Reader Lite for macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "lite-v*"

permissions:
  contents: read

concurrency:
  group: macos-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Lite data, types, lint and web build
        run: npm run check

      - name: Build macOS Universal DMG and ZIP
        run: npm run dist:mac

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Reader-Lite-macOS-Universal
          path: |
            release/*.dmg
          if-no-files-found: error
          retention-days: 14
